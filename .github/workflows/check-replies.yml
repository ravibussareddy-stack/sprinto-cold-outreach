name: Check replies

# The scheduler: every 5 minutes it calls the live reply checker on Vercel, which reads replies in
# Gmail and answers them (times, Calendly booking, follow-ups on the 3-3-2 day timers), crawls the
# news feeds at most hourly and re-researches stale companies once a day. All emails still go only
# to YOUR OWN inbox (SEND_TO).
#
# GitHub runs schedules on a best-effort basis: some runs start late or are skipped under load.
# The daily Vercel cron (04:00 UTC) is the guaranteed backstop; "Run workflow" checks at once.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-replies
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call the reply checker
        env:
          URL: ${{ vars.CHECK_URL || 'https://sprinto-cold-outreach-web.vercel.app/api/cron_check_replies?from=github' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$CRON_SECRET" ]; then AUTH="Authorization: Bearer $CRON_SECRET"; else AUTH="X-Caller: github"; fi
          code=$(curl -s -o out.json -w "%{http_code}" --max-time 290 -H "$AUTH" "$URL")
          echo "HTTP $code"
          python3 -c "import json; r=json.load(open('out.json')); print('threads:', json.dumps(r.get('threads', []))[:1500]); print('crawl:', json.dumps(r.get('crawl'), default=str)[:600])" || cat out.json
          test "$code" = "200"
