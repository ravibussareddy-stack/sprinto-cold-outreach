<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft email</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main style="max-width:900px">
  <nav class="glass nav" id="nav" style="margin-top:0"></nav>
  <div id="error" class="error"></div>
  <div id="content"></div>
  <section class="glass card section" id="feedback" hidden>
    <h2>Feedback on this email</h2>
    <p class="muted small" style="margin-top:-6px">Say what is wrong or what to do instead. It is saved to the feedback repo and used for
      every future draft it applies to. Then redraft this one to see if the disagreement score improves (nothing is sent).</p>
    <div class="form-row">
      <div><textarea class="input" id="fb-text" placeholder="e.g. Don't guess about their team's workload; stick to facts from their website."></textarea></div>
      <div><label class="small"><b>Applies to</b></label><select class="input" id="fb-scope">
        <option value="global">Every email</option><option value="role:cto">CTOs / engineering</option><option value="role:ceo">CEOs</option>
        <option value="role:founder">Founders</option><option value="role:security">Security / compliance leads</option>
        <option value="role:operations">Operations</option></select></div>
      <div><label class="small"><b>Weight</b></label><select class="input" id="fb-score">
        <option value="1.0">Strong (1.0)</option><option value="0.8" selected>Normal (0.8)</option><option value="0.6">Light (0.6)</option></select></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="fb-save">Save feedback</button>
        <button class="btn primary" id="redraft">Redraft with feedback</button></div>
    </div>
    <div class="note small" id="fb-note" style="margin-top:10px"></div>
    <div id="compare" style="margin-top:14px"></div>
  </section>
</main>
<script src="app.js"></script>
<script>
dash.nav("emails");
(function () {
  var E = dash.esc;
  var CHECK_NAMES = { greeting: "Time-of-day greeting", wellbeing_line: "“Hope you're doing well”",
    hook_names_company: "Hook names the company", one_question: "Exactly one question",
    question_before_sign_off: "Question just before sign-off", sign_off: "Sign-off with sender name",
    length: "Length 75-125 words", uk_spelling: "UK spelling", no_placeholders_or_banned: "No placeholders or banned phrases" };

  function list(items) {
    if (!items || !items.length) return '<p class="muted small">None</p>';
    return "<ul>" + items.map(function (i) { return "<li>" + E(i) + "</li>"; }).join("") + "</ul>";
  }
  function part(label, value, max) {
    var v = value == null ? 0 : value;
    return '<div style="margin-top:10px"><div class="small" style="display:flex;justify-content:space-between"><span>' + E(label) +
      "</span><b>" + E(v) + " / " + max + '</b></div><div class="bar"><span style="width:' + Math.round(v / max * 100) + '%"></span></div></div>';
  }

  var id = new URLSearchParams(location.search).get("id");
  Promise.all([dash.api("/api/run?id=" + encodeURIComponent(id)), dash.api("/api/review")]).then(function (both) {
    var r = both[0], queue = both[1];
    var inQueue = (queue.items || []).some(function (x) { return String(x.id) === String(id); });
    var rec = r.record || {}, q = rec.qualification || {}, email = rec.email || {}, d = rec.disagreement || {}, qual = rec.quality;
    var parts = d.parts || {};
    var hasScore = typeof d.score === "number";
    var structure = parts.structure != null ? parts.structure : parts.rules;      // older drafts used "rules"
    var wrong = parts.wrong_info != null ? parts.wrong_info : parts.claims;
    document.title = (r.domain || "Draft") + " - draft";

    var checksHtml = qual && qual.checks ? '<div class="checks">' + qual.checks.map(function (c) {
      return '<div class="check ' + (c.ok ? "ok" : "bad") + '"><span class="dot">' + (c.ok ? "&#10003;" : "!") + "</span><div><b>" +
        E(CHECK_NAMES[c.check] || c.check) + "</b>" + (c.detail ? '<div class="muted small">' + E(c.detail) + "</div>" : "") + "</div></div>";
    }).join("") + "</div>" : '<p class="muted small">Not recorded for this draft (quality checks were added later).</p>';

    document.getElementById("content").innerHTML =
      '<header class="glass top section"><div><h1>' + E(r.domain) + '</h1><div class="muted small">' +
        E(dash.when(r.created_at)) + " &middot; " + E(r.decision || "-") + " &middot; fit " + E(q.score == null ? "-" : q.score) +
        " &middot; contact " + E(rec.poc && rec.poc.email ? rec.poc.email : "none") + "</div></div>" +
        '<span class="pill strong">' + E((rec.status || "-").split(" (")[0]) + "</span></header>" +
      (inQueue ? '<div class="banner section" id="review-banner">Needs review: disagreement ' + E(d.score) + " is above " +
        E(queue.threshold) + '. <button class="btn" data-action="kept">Kept</button> <button class="btn" data-action="rewritten">Rewritten</button></div>' : "") +

      '<div class="grid-2">' +
        '<section class="glass lift card"><h2>Disagreement score</h2>' +
          (hasScore ? '<div class="big">' + d.score + '<span class="muted small"> / 100</span></div>' +
            part("Structure", structure, 25) + part("Wrong info", wrong, 45) + part("Sceptical judge", parts.judge, 30)
            : '<p class="muted">Not computed' + (d.error ? ": " + E(d.error) : "") + "</p>") +
          '<p class="muted small">Build 1: reported only. Nothing is held back.</p></section>' +
        '<section class="glass lift card"><h2>Quality checks' + (qual ? " &middot; " + qual.passed + "/" + qual.total + " passed" : "") + "</h2>" +
          checksHtml + "</section>" +
      "</div>" +

      '<section class="glass card section"><h2>Draft email</h2><p><b>' + E(email.subject || "(no draft)") + "</b></p>" +
        '<pre class="body">' + E(email.body || "") + "</pre></section>" +

      '<div class="grid-2">' +
        '<section class="glass card"><h2>Wrong or unsupported info</h2>' +
          '<div class="small"><b>About the company</b></div>' + list(d.wrong_about_company || d.claims_unsupported) +
          '<div class="small"><b>About Sprinto</b></div>' + list(d.wrong_about_sprinto) +
          '<div class="small"><b>Judge</b></div><p class="small">' + E(d.judge_reason || "-") + "</p></section>" +
        '<section class="glass card"><h2>Why this email</h2>' +
          '<div class="small"><b>Hook</b></div><p class="small">' + E(email.hook_used || "-") + "</p>" +
          '<div class="small"><b>Reasoning</b></div><p class="small">' + E(email.reasoning || "-") + "</p>" +
          '<div class="small"><b>Lessons used from the feedback repo</b></div><p class="small">' +
            E((rec.guidance_used || []).length ? rec.guidance_used.map(function (g) { return "#" + g.id + " (" + g.scope + ", " + g.score + ")"; }).join(", ") : "none") +
          "</p></section>" +
      "</div>";
  }).catch(function (e) { document.getElementById("error").textContent = e.message; });

  document.getElementById("content").addEventListener("click", function (ev) {
    var b = ev.target.closest("#review-banner button");
    if (!b) return;
    dash.api("/api/review", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ run_id: Number(id), action: b.dataset.action }) })
      .then(function () { document.getElementById("review-banner").textContent = "Reviewed: marked " + b.dataset.action + "."; })
      .catch(function (e) { document.getElementById("error").textContent = e.message; });
  });
})();
</script>
<script>
(function () {
  var E = dash.esc, id = new URLSearchParams(location.search).get("id");
  var ROLE = [[/ciso|security|compliance|grc|trust/i, "role:security"], [/\bcto\b|technology|engineering|engineer/i, "role:cto"],
              [/\bceo\b|chief executive/i, "role:ceo"], [/founder/i, "role:founder"], [/\bcoo\b|operations/i, "role:operations"]];
  var note = document.getElementById("fb-note");
  function say(t, cls) { note.textContent = t; note.className = "note small " + (cls || ""); }

  dash.api("/api/run?id=" + encodeURIComponent(id)).then(function (r) {
    var rec = r.record || {};
    if (!rec.email) return;
    document.getElementById("feedback").hidden = false;
    var title = (rec.poc && rec.poc.title) || "";
    for (var i = 0; i < ROLE.length; i++) if (ROLE[i][0].test(title)) { document.getElementById("fb-scope").value = ROLE[i][1]; break; }
    if (location.hash === "#feedback") document.getElementById("feedback").scrollIntoView({ behavior: "smooth" });
  });

  function saveFeedback() {
    var text = document.getElementById("fb-text").value.trim();
    if (!text) return Promise.resolve(null);
    if (text.length < 5) return Promise.reject(new Error("Write at least a few words."));
    return dash.api("/api/feedback", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ guidance: text, scope: document.getElementById("fb-scope").value,
                             score: Number(document.getElementById("fb-score").value), run_id: Number(id) }) });
  }

  document.getElementById("fb-save").addEventListener("click", function () {
    saveFeedback().then(function (r) { if (r) { say("Saved to the feedback repo as #" + r.id + ".", "ok"); document.getElementById("fb-text").value = ""; }
                                       else say("Write some feedback first.", "bad"); })
      .catch(function (e) { say(e.message, "bad"); });
  });

  function side(label, x, better) {
    var parts = x.parts || {};
    return '<div class="side' + (better ? " better" : "") + '"><div class="row-head"><b>' + E(label) + '</b><span class="pill ' + (better ? "strong" : "soft") + '">' +
      E(x.disagreement == null ? "-" : x.disagreement + "/100") + "</span></div>" +
      '<div class="muted small">structure ' + E(parts.structure != null ? parts.structure : (parts.rules || 0)) + " \u00b7 wrong info " +
      E(parts.wrong_info != null ? parts.wrong_info : (parts.claims || 0)) + " \u00b7 judge " + E(parts.judge || 0) +
      (x.quality ? " \u00b7 quality " + E(x.quality) : "") + "</div>" +
      (x.wrong_info && x.wrong_info.length ? '<div class="small" style="margin-top:6px"><b>Unsupported:</b> ' + E(x.wrong_info.join("; ")) + "</div>" : "") +
      '<p style="margin:10px 0 4px"><b>' + E(x.subject || "") + '</b></p><pre class="body small">' + E(x.body || "") + "</pre>" +
      (x.run_id ? '<a class="small" href="draft.html?id=' + E(x.run_id) + '">open run ' + E(x.run_id) + "</a>" : "") + "</div>";
  }

  document.getElementById("redraft").addEventListener("click", function () {
    var btn = this;
    btn.disabled = true;
    say("Saving feedback and redrafting... about 30-60 seconds.", "");
    saveFeedback().then(function () {
      return dash.api("/api/redraft", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ run_id: Number(id) }) });
    }).then(function (r) {
      var verdict = r.change == null ? "" : r.change < 0 ? "Disagreement down " + Math.abs(r.change) + " points." :
                    r.change === 0 ? "Disagreement unchanged." : "Disagreement up " + r.change + " points.";
      say(verdict + " Used " + r.guidance_used.length + " piece(s) of feedback" + (r.needs_review ? "; still above " + r.threshold + ", so it stays in review." : "."), r.improved ? "ok" : "");
      document.getElementById("compare").innerHTML = '<div class="compare">' + side("Before", r.before, false) + side("After (redrafted)", r.after, r.improved) + "</div>" +
        (r.guidance_used.length ? '<div class="small muted" style="margin-top:10px">Feedback used, best first: ' +
          r.guidance_used.map(function (g) { return "#" + g.id + " (" + g.scope + ", " + Number(g.score).toFixed(1) + ")"; }).join(", ") + "</div>" : "");
    }).catch(function (e) { say("Redraft failed: " + e.message, "bad"); })
      .then(function () { btn.disabled = false; });
  });
})();
</script>
</body>
</html>
