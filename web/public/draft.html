<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft email</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main style="max-width:900px">
  <a href="index.html" class="small">&larr; Dashboard</a>
  <div id="error" class="error"></div>
  <div id="content"></div>
</main>
<script src="app.js"></script>
<script>
(function () {
  var E = dash.esc;
  var CHECK_NAMES = { greeting: "Time-of-day greeting", wellbeing_line: "“Hope you're doing well”",
    hook_names_company: "Hook names the company", one_question: "Exactly one question",
    question_before_sign_off: "Question just before sign-off", sign_off: "Sign-off with sender name",
    length: "Length 75-125 words", uk_spelling: "UK spelling", no_placeholders_or_banned: "No placeholders or banned phrases" };

  function list(items) {
    if (!items || !items.length) return '<p class="muted small">None</p>';
    return "<ul>" + items.map(function (i) { return "<li>" + E(i) + "</li>"; }).join("") + "</ul>";
  }
  function part(label, value, max) {
    var v = value == null ? 0 : value;
    return '<div style="margin-top:10px"><div class="small" style="display:flex;justify-content:space-between"><span>' + E(label) +
      "</span><b>" + E(v) + " / " + max + '</b></div><div class="bar"><span style="width:' + Math.round(v / max * 100) + '%"></span></div></div>';
  }

  var id = new URLSearchParams(location.search).get("id");
  Promise.all([dash.api("/api/run?id=" + encodeURIComponent(id)), dash.api("/api/review")]).then(function (both) {
    var r = both[0], queue = both[1];
    var inQueue = (queue.items || []).some(function (x) { return String(x.id) === String(id); });
    var rec = r.record || {}, q = rec.qualification || {}, email = rec.email || {}, d = rec.disagreement || {}, qual = rec.quality;
    var parts = d.parts || {};
    var hasScore = typeof d.score === "number";
    var structure = parts.structure != null ? parts.structure : parts.rules;      // older drafts used "rules"
    var wrong = parts.wrong_info != null ? parts.wrong_info : parts.claims;
    document.title = (r.domain || "Draft") + " - draft";

    var checksHtml = qual && qual.checks ? '<div class="checks">' + qual.checks.map(function (c) {
      return '<div class="check ' + (c.ok ? "ok" : "bad") + '"><span class="dot">' + (c.ok ? "&#10003;" : "!") + "</span><div><b>" +
        E(CHECK_NAMES[c.check] || c.check) + "</b>" + (c.detail ? '<div class="muted small">' + E(c.detail) + "</div>" : "") + "</div></div>";
    }).join("") + "</div>" : '<p class="muted small">Not recorded for this draft (quality checks were added later).</p>';

    document.getElementById("content").innerHTML =
      '<header class="glass top section"><div><h1>' + E(r.domain) + '</h1><div class="muted small">' +
        E(dash.when(r.created_at)) + " &middot; " + E(r.decision || "-") + " &middot; fit " + E(q.score == null ? "-" : q.score) +
        " &middot; contact " + E(rec.poc && rec.poc.email ? rec.poc.email : "none") + "</div></div>" +
        '<span class="pill strong">' + E((rec.status || "-").split(" (")[0]) + "</span></header>" +
      (inQueue ? '<div class="banner section" id="review-banner">Needs review: disagreement ' + E(d.score) + " is above " +
        E(queue.threshold) + '. <button class="btn" data-action="kept">Kept</button> <button class="btn" data-action="rewritten">Rewritten</button></div>' : "") +

      '<div class="grid-2">' +
        '<section class="glass lift card"><h2>Disagreement score</h2>' +
          (hasScore ? '<div class="big">' + d.score + '<span class="muted small"> / 100</span></div>' +
            part("Structure", structure, 25) + part("Wrong info", wrong, 45) + part("Sceptical judge", parts.judge, 30)
            : '<p class="muted">Not computed' + (d.error ? ": " + E(d.error) : "") + "</p>") +
          '<p class="muted small">Build 1: reported only. Nothing is held back.</p></section>' +
        '<section class="glass lift card"><h2>Quality checks' + (qual ? " &middot; " + qual.passed + "/" + qual.total + " passed" : "") + "</h2>" +
          checksHtml + "</section>" +
      "</div>" +

      '<section class="glass card section"><h2>Draft email</h2><p><b>' + E(email.subject || "(no draft)") + "</b></p>" +
        '<pre class="body">' + E(email.body || "") + "</pre></section>" +

      '<div class="grid-2">' +
        '<section class="glass card"><h2>Wrong or unsupported info</h2>' +
          '<div class="small"><b>About the company</b></div>' + list(d.wrong_about_company || d.claims_unsupported) +
          '<div class="small"><b>About Sprinto</b></div>' + list(d.wrong_about_sprinto) +
          '<div class="small"><b>Judge</b></div><p class="small">' + E(d.judge_reason || "-") + "</p></section>" +
        '<section class="glass card"><h2>Why this email</h2>' +
          '<div class="small"><b>Hook</b></div><p class="small">' + E(email.hook_used || "-") + "</p>" +
          '<div class="small"><b>Reasoning</b></div><p class="small">' + E(email.reasoning || "-") + "</p>" +
          '<div class="small"><b>Lessons used from the feedback repo</b></div><p class="small">' +
            E((rec.guidance_used || []).length ? rec.guidance_used.map(function (g) { return "#" + g.id + " (" + g.scope + ", " + g.score + ")"; }).join(", ") : "none") +
          "</p></section>" +
      "</div>";
  }).catch(function (e) { document.getElementById("error").textContent = e.message; });

  document.getElementById("content").addEventListener("click", function (ev) {
    var b = ev.target.closest("#review-banner button");
    if (!b) return;
    dash.api("/api/review", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ run_id: Number(id), action: b.dataset.action }) })
      .then(function () { document.getElementById("review-banner").textContent = "Reviewed: marked " + b.dataset.action + "."; })
      .catch(function (e) { document.getElementById("error").textContent = e.message; });
  });
})();
</script>
</body>
</html>
